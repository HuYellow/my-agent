name: "Yellow Flow Runtime"
description: "Run a Yellow Flow automation, workflow, or non-interactive prompt in GitHub Actions."
inputs:
  automation_id:
    description: "Automation id to run."
    required: false
  workflow_id:
    description: "Workflow id to run."
    required: false
  project_id:
    description: "Project id registered in the runtime."
    required: false
  prompt:
    description: "Prompt to run in non-interactive mode."
    required: false
  thread_title:
    description: "Optional thread title when running a prompt."
    required: false
outputs:
  mode:
    description: "Execution mode used by the action."
  automation_run_id:
    description: "Automation run id when automation mode is used."
  summary:
    description: "Top-level summary reported by the runtime when available."
  success:
    description: "Whether the runtime call completed successfully."
runs:
  using: "node20"
  main: "dist/index.js"
